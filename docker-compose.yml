services:
  gasbel-web:
    build: .
    container_name: gasbel-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=Sqlite
    networks:
      - default
      - foyke_net

networks:
  default:
  foyke_net:
    external: true
    name: docker_foyke-network
